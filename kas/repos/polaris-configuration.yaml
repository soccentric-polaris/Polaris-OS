header:
  version: 14

repos:
  # Polaris-Configuration ships its own meta-webconfig Yocto layer (the
  # on-device WebConfig daemon + static frontend + schemas + board
  # manifest). Only that subdirectory is a layer; the rest of the repo
  # (Rust workspace, frontend source) is not needed by the build.
  polaris-configuration:
    url: https://github.com/soccentric-polaris/Polaris-Configuration.git
    branch: develop
    path: meta/polaris-configuration
    layers:
      meta-webconfig:
