header:
  version: 14

repos:
  # Polaris-Instrumentation ships its own Yocto layer (yocto/, collection
  # name "instrumentation"). NOT yet added to any IMAGE_INSTALL: the
  # recipe's COMPATIBLE_MACHINE list does not include smarc-rzg2l
  # (Polaris's board) and has no devices/capabilities/resource-profile
  # descriptors for it — both leftover from this leaf starting as an
  # unadapted Arches-Instrumentation copy. Adding the "instrumentation"
  # package to IMAGE_INSTALL before that is fixed would fail the build
  # ("nothing provides instrumentation"), not just ship an empty package.
  # See Polaris-Instrumentation/yocto's layer.conf and instrumentation.bb
  # for the parts still needing board-specific work.
  polaris-instrumentation:
    url: git@github.com:soccentric-polaris/Polaris-Instrumentation.git
    branch: develop
    path: meta/polaris-instrumentation
    layers:
      yocto:
