header:
  version: 14
  includes:
    - repos/poky.yaml
    - repos/meta-arm.yaml
    - repos/meta-openembedded.yaml
    - repos/meta-renesas.yaml
    - repos/meta-swupdate.yaml
    - repos/meta-polaris.yaml
    - repos/polaris-instrumentation.yaml

distro: poky
target: polaris-image

local_conf_header:
  base: |
    # Init manager
    INIT_MANAGER = "systemd"

    # webconfigd talks to systemd over D-Bus via polkit (see its recipe's
    # 50-webconfigd.polkit.rules). polkit is skipped unless this distro
    # feature is enabled -- without it, RRECOMMENDS:webconfigd = "... polkit"
    # has no buildable provider and the image fails to build outright.
    DISTRO_FEATURES:append = " polkit"

    # SD card / eMMC image output
    IMAGE_FSTYPES = "wic.bz2 wic.bmap ext4"

    # Shared caches (bind-mounted by Docker)
    DL_DIR     ?= "${TOPDIR}/../cache/downloads"
    SSTATE_DIR ?= "${TOPDIR}/../cache/sstate-cache"

    # SWUpdate: web server/UI intentionally not enabled

    # Required by Poky sanity checks (must match LOCALCONF_VERSION in poky)
    CONF_VERSION = "2"

    # Swupdate specific variables
    SWUPDATE_INIT = "systemd"

    # RZ/G2L boots via the Renesas BSP boot chain (Flash Writer → U-Boot SPL →
    # U-Boot → Linux). TF-A is provided by meta-arm / meta-renesas.
    # Kernel is Image; DTB is renesas/r9a07g044l2-smarc.dtb.
